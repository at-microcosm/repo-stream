[package]
name = "repo-stream"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Fast and robust atproto CAR file processing"
repository = "https://tangled.org/@microcosm.blue/repo-stream"

[dependencies]
fjall = { version = "3.0.1", default-features = false }
hashbrown = { version = "0.16.1", optional = true }
cid = { version = "0.11.1", features = ["serde"] }
iroh-car = "0.5.1"
log = "0.4.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_ipld_dagcbor = "0.6.4"
sha2 = "0.10.9" # note: hmac-sha256 is simpler, smaller, benches ~15ns slower
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["rt", "sync"] }

[features]
default = []
hashbrown = ["dep:hashbrown"]

[dev-dependencies]
clap = { version = "4.5.48", features = ["derive"] }
criterion = { version = "0.7.0", features = ["async_tokio"] }
env_logger = "0.11.8"
multibase = "0.9.2"
tempfile = "3.23.0"
tokio = { version = "1.47.1", features = ["full"] }
mimalloc = "0.1.48"
hmac-sha256 = "1.1.12"
async-channel = "2.5.0"

[profile.profiling]
inherits = "release"
debug = true

# [profile.release]
# debug = true

[[bench]]
name = "non-huge-cars"
harness = false

[[bench]]
name = "huge-car"
harness = false

[[bench]]
name = "collections"
harness = false

# [[bench]]
# name = "leading"
# harness = false
